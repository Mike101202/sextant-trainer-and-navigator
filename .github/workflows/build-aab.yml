name: Build signed AAB (Google Play)

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
    - uses: actions/checkout@v4

    - name: Check signing secrets exist
      run: |
        for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
          if [ -z "${!v}" ]; then echo "Missing GitHub secret: $v"; exit 1; fi
        done

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Install dependencies
      run: npm install

    - name: Sync web assets
      run: npx cap sync android

    - name: Decode upload keystore
      run: |
        CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')
        echo "Secret length: ${#CLEAN} characters (expect roughly 3000-4500)"
        echo "Starts with: ${CLEAN:0:4} (expect MIIK, MIIJ or similar)"
        echo "Ends with: ${CLEAN: -2}"
        printf '%s' "$CLEAN" | base64 -d > "$RUNNER_TEMP/upload.jks"
        ls -l "$RUNNER_TEMP/upload.jks"

    - name: Build release bundle
      env:
        KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
        VERSION_CODE: ${{ github.run_number }}
      run: |
        cd android
        chmod +x gradlew
        ./gradlew bundleRelease

    - name: Upload AAB
      uses: actions/upload-artifact@v4
      with:
        name: Sextant-Trainer-AAB
        path: android/app/build/outputs/bundle/release/app-release.aab

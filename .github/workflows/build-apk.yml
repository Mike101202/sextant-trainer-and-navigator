name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Set up Java 21
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v4

    - name: Install dependencies
      run: npm install

    - name: Sync web assets
      run: npx cap sync android

    - name: Add GPS permissions
      run: |
        MANIFEST="android/app/src/main/AndroidManifest.xml"
        if ! grep -q "ACCESS_FINE_LOCATION" "$MANIFEST"; then
          sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />' "$MANIFEST"
        fi

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Sextant-Navigator-APK
        path: android/app/build/outputs/apk/debug/app-debug.apk


